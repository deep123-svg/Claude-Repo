<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#172033; --muted:#6B7488; --line:#E3E7EF;
  --accent:#3558E8; --accent-soft:#E8EDFF; --accent-ink:#FFFFFF;
  --crit:#B42380; --high:#D8453B; --med:#C98A12; --low:#2E9A6B;
  --shadow:0 1px 2px rgba(23,32,51,.04),0 12px 32px -12px rgba(23,32,51,.14);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161C2D; --ink:#E8ECF6; --muted:#8B94AB; --line:#252D44;
  --accent:#6F8BFF; --accent-soft:#222C52; --accent-ink:#0E1320;
  --crit:#F274C4; --high:#FF7468; --med:#E8B04A; --low:#58C494;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;padding:48px 16px 96px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:680px;margin:0 auto}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.date{color:var(--muted);font-size:.95rem;margin-top:4px}
.actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted);transition:color .15s,border-color .15s}
.icon-btn:hover{color:var(--ink);border-color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:12px;padding:0 20px;height:42px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--muted);filter:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.progress{padding:20px 24px;display:flex;align-items:center;gap:20px;margin-bottom:16px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);transition:background .4s}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.progress h2{font-size:1.05rem;font-weight:700}
.progress p{color:var(--muted);font-size:.9rem}

.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-size:.875rem;font-weight:600;color:var(--muted);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.search{flex:1 1 160px;max-width:240px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:.875rem;outline:none}
.search:focus{border-color:var(--accent)}

ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sev,var(--line));border-radius:14px;transition:border-color .15s,opacity .2s}
.task[data-sev="critical"]{--sev:var(--crit)}.task[data-sev="high"]{--sev:var(--high)}.task[data-sev="medium"]{--sev:var(--med)}.task[data-sev="low"]{--sev:var(--low)}
.task.enter{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.check{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;transition:all .15s}
.check:hover{border-color:var(--accent)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1;min-width:0}
.title{font-weight:500;overflow-wrap:anywhere;cursor:text}
.task.done .title{color:var(--muted);text-decoration:line-through}
.task.done{opacity:.7}
.edit{width:100%;border:1px solid var(--accent);background:var(--bg);border-radius:8px;padding:6px 10px;outline:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:4px;font-size:.78rem;color:var(--muted);align-items:center}
.sev{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--sev)}
.sev::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.overdue{color:var(--high);font-weight:600}
.del{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;opacity:0;transition:opacity .15s,background .15s,color .15s;display:grid;place-items:center}
.task:hover .del,.del:focus-visible{opacity:1}
.del:hover{background:color-mix(in srgb,var(--high) 12%,transparent);color:var(--high)}
@media (hover:none){.del{opacity:1}}

.empty{text-align:center;padding:48px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.empty strong{color:var(--ink);font-size:1.05rem}
.empty .btn{margin-top:12px}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--muted);font-size:.875rem}
.link{border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--high)}

/* Add task popup */
dialog{border:0;padding:0;background:transparent;margin:auto;max-width:calc(100vw - 24px);width:480px;color:var(--ink)}
dialog::backdrop{background:rgba(10,15,30,.55);backdrop-filter:blur(3px)}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);padding:26px}
.modal h2{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.modal .sub{color:var(--muted);font-size:.9rem;margin:2px 0 20px}
.field{display:block;margin-bottom:16px}
.field>span,.legend{display:block;font-size:.82rem;font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:.95rem;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.seg span{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 4px;border:1px solid var(--line);border-radius:12px;font-size:.85rem;font-weight:600;color:var(--muted);transition:all .15s}
.seg span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.seg input:checked+span{color:var(--ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:.78rem;color:var(--muted);margin-top:6px}
.err{color:var(--high);font-size:.82rem;margin-top:6px;min-height:1.2em}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}

/* Reminder alerts */
#alerts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:50;width:min(360px,calc(100vw - 32px))}
.alert{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;animation:in .25s ease-out}
.alert b{display:block;font-size:.8rem;color:var(--accent);margin-bottom:2px}
.alert p{font-weight:600;overflow-wrap:anywhere}
.alert small{color:var(--muted)}
.alert .btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.alert button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:.8rem;font-weight:600;cursor:pointer}
.alert button:hover{border-color:var(--accent)}

@media (max-width:520px){body{padding-top:28px}h1{font-size:1.6rem}.row{grid-template-columns:1fr}.seg{grid-template-columns:1fr 1fr}.btn .lbl{display:none}.btn{padding:0 14px}.empty .btn .lbl{display:inline}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>Today’s tasks</h1>
      <p class="date" id="date"></p>
    </div>
    <div class="actions">
      <button type="button" class="icon-btn" id="theme" aria-label="Switch color theme" title="Switch color theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button type="button" class="btn" id="openAdd">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span class="lbl">Add task</span>
      </button>
    </div>
  </header>

  <section class="card progress" aria-live="polite">
    <div class="ring" id="ring"><span id="pct">0%</span></div>
    <div><h2 id="pTitle">No tasks yet</h2><p id="pSub">Add your first task to get started.</p></div>
  </section>

  <div class="toolbar">
    <div class="tabs" role="group" aria-label="Filter tasks">
      <button type="button" class="tab" data-f="all" aria-pressed="true">All</button>
      <button type="button" class="tab" data-f="active" aria-pressed="false">Active</button>
      <button type="button" class="tab" data-f="done" aria-pressed="false">Completed</button>
    </div>
    <input class="search" id="search" type="search" placeholder="Search tasks" aria-label="Search tasks">
  </div>

  <ul id="list"></ul>

  <footer>
    <span id="count"></span>
    <button type="button" class="link" id="clear">Clear completed</button>
  </footer>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="modal">
    <h2 id="dlgTitle">New task</h2>
    <p class="sub">Set how urgent it is and when you want a reminder.</p>

    <label class="field"><span>Task</span>
      <input type="text" id="fText" placeholder="e.g. Send the project proposal" maxlength="200" autocomplete="off">
    </label>

    <div class="field">
      <span class="legend" id="sevLabel">Severity</span>
      <div class="seg" role="radiogroup" aria-labelledby="sevLabel">
        <label><input type="radio" name="sev" value="low"><span style="--c:var(--low)">Low</span></label>
        <label><input type="radio" name="sev" value="medium" checked><span style="--c:var(--med)">Medium</span></label>
        <label><input type="radio" name="sev" value="high"><span style="--c:var(--high)">High</span></label>
        <label><input type="radio" name="sev" value="critical"><span style="--c:var(--crit)">Critical</span></label>
      </div>
    </div>

    <div class="row">
      <label class="field"><span>Due date</span><input type="date" id="fDate"></label>
      <label class="field"><span>Due time</span><input type="time" id="fTime"></label>
    </div>

    <label class="field"><span>Remind me</span>
      <select id="fLead">
        <option value="0">At due time</option>
        <option value="10">10 minutes before</option>
        <option value="60">1 hour before</option>
        <option value="1440">1 day before</option>
      </select>
      <div class="hint">Reminders appear while this page is open. Allow notifications to be alerted even when it’s in the background.</div>
    </label>

    <div class="err" id="fErr" role="alert"></div>
    <div class="foot">
      <button type="button" class="btn ghost" id="cancel">Cancel</button>
      <button type="button" class="btn" id="save">Save task</button>
    </div>
  </div>
</dialog>

<div id="alerts" aria-live="assertive"></div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var KEY = "todo.tasks.v2", THEME = "todo.theme";
  var SEV = { low: "Low", medium: "Medium", high: "High", critical: "Critical" };
  var tasks = [], filter = "all", query = "", justAdded = null;

  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function write(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function save() { write(KEY, JSON.stringify(tasks)); }

  try {
    var raw = read(KEY) || read("todo.tasks.v1");
    tasks = (JSON.parse(raw) || []).map(function (t) {
      return { id: t.id, text: t.text, done: !!t.done, severity: t.severity || t.priority || "medium",
        due: t.due || null, time: t.time || null, lead: t.lead == null ? 0 : t.lead, notified: !!t.notified, snooze: t.snooze || null };
    });
  } catch (e) { tasks = []; }

  /* Theme */
  var theme = read(THEME) || (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  function applyTheme() { document.documentElement.setAttribute("data-theme", theme); }
  applyTheme();
  $("#theme").addEventListener("click", function () { theme = theme === "dark" ? "light" : "dark"; applyTheme(); write(THEME, theme); });
  $("#date").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  /* Helpers */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function dueAt(t) { return t.due ? new Date(t.due + "T" + (t.time || "09:00")) : null; }
  function remindAt(t) {
    if (t.snooze) return new Date(t.snooze);
    var d = dueAt(t); return d ? new Date(d.getTime() - t.lead * 60000) : null;
  }
  function fmtDue(t) {
    var d = dueAt(t), now = new Date();
    var a = new Date(d); a.setHours(0, 0, 0, 0);
    var b = new Date(now); b.setHours(0, 0, 0, 0);
    var diff = Math.round((a - b) / 864e5);
    var day = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: a.getFullYear() !== b.getFullYear() ? "numeric" : undefined });
    return day + (t.time ? ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : "");
  }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

  /* Render */
  function render() {
    var total = tasks.length, done = tasks.filter(function (t) { return t.done; }).length, left = total - done;
    var pct = total ? Math.round(done / total * 100) : 0;
    $("#ring").style.setProperty("--p", pct);
    $("#pct").textContent = pct + "%";
    $("#pTitle").textContent = !total ? "No tasks yet" : left === 0 ? "All done" : plural(left, "task") + " remaining";
    $("#pSub").textContent = !total ? "Add your first task to get started." : done + " of " + total + " completed";
    $("#count").textContent = plural(total, "task") + " in total";
    $("#clear").style.visibility = done ? "visible" : "hidden";

    var q = query.trim().toLowerCase(), now = new Date();
    var shown = tasks.filter(function (t) {
      return (filter === "all" || (filter === "done") === t.done) && (!q || t.text.toLowerCase().indexOf(q) > -1);
    });
    var html;
    if (!shown.length) {
      var msg = !total ? ["No tasks yet", "Create a task and set a reminder so nothing slips."]
        : q ? ["No matches", "Try a different search term."]
        : filter === "done" ? ["No completed tasks", "Finished tasks will show up here."]
        : ["You’re all caught up", "There are no active tasks left."];
      html = '<li class="empty"><strong>' + msg[0] + "</strong>" + msg[1] +
        (!total ? '<button type="button" class="btn" data-open="1">Add task</button>' : "") + "</li>";
    } else {
      html = shown.map(function (t) {
        var d = dueAt(t), over = d && !t.done && d < now;
        return '<li class="task' + (t.done ? " done" : "") + (t.id === justAdded ? " enter" : "") + '" data-id="' + t.id + '" data-sev="' + t.severity + '">' +
          '<input type="checkbox" class="check"' + (t.done ? " checked" : "") + ' aria-label="Mark complete">' +
          '<div class="body"><div class="title" title="Double-click to edit">' + esc(t.text) + "</div>" +
          '<div class="meta"><span class="sev">' + (SEV[t.severity] || "Medium") + "</span>" +
          (d ? '<span class="' + (over ? "overdue" : "") + '">' + (over ? "Overdue · " : "Due ") + fmtDue(t) + "</span>" : "") +
          "</div></div>" +
          '<button type="button" class="del" aria-label="Delete task"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg></button></li>';
      }).join("");
    }
    $("#list").innerHTML = html;
    justAdded = null;
  }

  /* Add task popup */
  var dlg = $("#dlg");
  function openDialog() {
    $("#fText").value = ""; $("#fDate").value = ""; $("#fTime").value = ""; $("#fLead").value = "0";
    $("#fErr").textContent = "";
    document.querySelector('input[name="sev"][value="medium"]').checked = true;
    $("#fDate").min = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
    $("#fText").focus();
  }
  function closeDialog() { if (typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open"); }

  function saveTask() {
    var text = $("#fText").value.trim(), date = $("#fDate").value, time = $("#fTime").value;
    if (!text) { $("#fErr").textContent = "Enter a task name."; $("#fText").focus(); return; }
    if (time && !date) { $("#fErr").textContent = "Pick a due date to go with the time."; $("#fDate").focus(); return; }
    var t = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      text: text, done: false,
      severity: document.querySelector('input[name="sev"]:checked').value,
      due: date || null, time: time || null,
      lead: parseInt($("#fLead").value, 10) || 0, notified: false, snooze: null
    };
    tasks.unshift(t); justAdded = t.id; save();
    closeDialog();
    filter = "all"; query = ""; $("#search").value = "";
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.f === "all")); });
    render();
    if (date && "Notification" in window && Notification.permission === "default") {
      try { Notification.requestPermission(); } catch (e) {}
    }
    checkReminders();
  }

  $("#openAdd").addEventListener("click", openDialog);
  $("#cancel").addEventListener("click", closeDialog);
  $("#save").addEventListener("click", saveTask);
  dlg.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); saveTask(); }
  });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) closeDialog(); });

  /* List interactions */
  var list = $("#list");
  function idOf(el) { var li = el.closest(".task"); return li ? li.dataset.id : null; }
  function find(id) { return tasks.filter(function (t) { return t.id === id; })[0]; }

  list.addEventListener("click", function (e) {
    if (e.target.closest("[data-open]")) { openDialog(); return; }
    var del = e.target.closest(".del");
    if (del) { var id = idOf(del); tasks = tasks.filter(function (t) { return t.id !== id; }); save(); render(); return; }
    if (e.target.classList.contains("check")) {
      var t = find(idOf(e.target));
      if (t) { t.done = e.target.checked; save(); render(); }
    }
  });
  list.addEventListener("dblclick", function (e) {
    var title = e.target.closest(".title"); if (!title) return;
    var t = find(idOf(title)); if (!t) return;
    var input = document.createElement("input");
    input.className = "edit"; input.value = t.text; input.maxLength = 200; input.setAttribute("aria-label", "Edit task");
    title.replaceWith(input); input.focus(); input.select();
    var finished = false;
    function finish(commit) {
      if (finished) return; finished = true;
      var v = input.value.trim();
      if (commit && v) { t.text = v; save(); }
      render();
    }
    input.addEventListener("blur", function () { finish(true); });
    input.addEventListener("keydown", function (ev) { if (ev.key === "Enter") finish(true); if (ev.key === "Escape") finish(false); });
  });

  document.querySelectorAll(".tab").forEach(function (b) {
    b.addEventListener("click", function () {
      filter = b.dataset.f;
      document.querySelectorAll(".tab").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      render();
    });
  });
  $("#search").addEventListener("input", function (e) { query = e.target.value; render(); });
  $("#clear").addEventListener("click", function () { tasks = tasks.filter(function (t) { return !t.done; }); save(); render(); });

  /* Reminders */
  function beep() {
    try {
      var C = window.AudioContext || window.webkitAudioContext, c = new C(), o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.value = 880; g.gain.value = 0.05;
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.25);
    } catch (e) {}
  }
  function showAlert(t) {
    var el = document.createElement("div");
    el.className = "alert"; el.setAttribute("role", "alert");
    el.innerHTML = "<b>Reminder · " + (SEV[t.severity] || "") + "</b><p>" + esc(t.text) + "</p><small>Due " + esc(fmtDue(t)) + "</small>" +
      '<div class="btns"><button type="button" data-a="done">Mark done</button><button type="button" data-a="snooze">Snooze 10 min</button><button type="button" data-a="dismiss">Dismiss</button></div>';
    el.addEventListener("click", function (e) {
      var a = e.target.getAttribute("data-a"); if (!a) return;
      if (a === "done") { t.done = true; save(); render(); }
      if (a === "snooze") { t.notified = false; t.snooze = new Date(Date.now() + 600000).toISOString(); save(); }
      el.remove();
    });
    $("#alerts").appendChild(el);
    beep();
    if ("Notification" in window && Notification.permission === "granted") {
      try { new Notification("Task reminder", { body: t.text + " — due " + fmtDue(t) }); } catch (e) {}
    }
  }
  function checkReminders() {
    var now = new Date(), changed = false;
    tasks.forEach(function (t) {
      if (t.done || t.notified) return;
      var r = remindAt(t);
      if (r && r <= now) { t.notified = true; t.snooze = null; changed = true; showAlert(t); }
    });
    if (changed) { save(); render(); }
  }

  render();
  checkReminders();
  setInterval(checkReminders, 15000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { checkReminders(); render(); } });
})();
</script>
</body>
</html>
